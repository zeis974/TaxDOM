name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  HUSKY: "0"
  TURBO_TELEMETRY_DISABLED: "1"
  # Pull requests only run what their diff affects. main runs everything: GitHub scopes a cache
  # saved on a PR ref to that PR, so main is what fills the cache every branch can restore.
  AFFECTED: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
  TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}

jobs:
  checks:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Full history: --affected and Biome's --changed need the merge base
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Lint changed files
        env:
          SINCE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: pnpm exec biome ci --changed --since="$SINCE" --no-errors-on-unmatched

      # The dashboard is excluded until its pre-existing type errors are fixed
      - name: Typecheck and unit tests
        run: pnpm exec turbo run typecheck test $AFFECTED --filter='!@taxdom/dashboard'

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # Skip the browser install entirely when every e2e task is unaffected or already cached
      - name: Plan e2e run
        id: plan
        run: |
          misses=$(pnpm exec turbo run test:e2e $AFFECTED --dry=json \
            | jq '[.tasks[] | select(.task == "test:e2e" and .command != "<NONEXISTENT>" and .cache.status != "HIT")] | length')
          echo "run=$([ "$misses" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "playwright=$(pnpm --filter @taxdom/app exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: browsers
        if: steps.plan.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.plan.outputs.playwright }}

      - name: Install Chromium
        if: steps.plan.outputs.run == 'true' && steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @taxdom/app exec playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.plan.outputs.run == 'true' && steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @taxdom/app exec playwright install-deps chromium

      - name: End-to-end tests
        run: pnpm exec turbo run test:e2e $AFFECTED

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
