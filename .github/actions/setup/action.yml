name: Setup workspace
description: Install pnpm, Node.js and the workspace dependencies, then start the Turborepo cache server

runs:
  using: composite
  steps:
    # Reads the pnpm version from the root package.json `packageManager` field
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    # Same Node.js version as the Dockerfiles; restores the pnpm store keyed on pnpm-lock.yaml
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24.22.0
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline

    # Serves Turborepo's remote cache API from the GitHub Actions cache: every task output is its
    # own cache entry, so nothing grows unbounded and GitHub evicts unused entries on its own
    - uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
